{% extends "base.html" %}
{% block titel %}Redaktionen – Gulvmåtten{% endblock %}
{% block navigation %}
<nav class="navigation redaktionsnav" aria-label="Redaktionen">
  <div class="bredde">
    <ul class="byvalg">
      <li><a href="{{ url_for('redaktion') }}">Redaktionen</a></li>
      <li><a href="{{ url_for('forside') }}">Se hjemmesiden</a></li>
    </ul>
    {% if session.get('redaktoer') %}
    <form method="post" action="{{ url_for('logud') }}" class="logud">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="knap lille sekundaer">Log ud</button>
    </form>
    {% endif %}
  </div>
</nav>
{% endblock %}
