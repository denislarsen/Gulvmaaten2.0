# Kildeprofiler for Gulvmåtten 2.0
#
# Hver kilde har:
#   id          Kort unikt navn
#   navn        Visningsnavn
#   url         Adressen der hentes
#   type        rss, html, sitemap eller boligsiden
#   kategori    Hvilken slags kilde (kommune, havn, kultur, sport, forening, medie, bolig ...)
#   by          Hundested, Halsnæs (hele kommunen) eller Frederiksværk
#   tillid      1-5, hvor 5 er en officiel kilde man kan stole fuldt på
#   frekvens    Hvor ofte kilden bør hentes, i timer
#   prioritet   1-3. 3 = særligt fokus, opslag vurderes en ekstra gang op
#   kun_tip     true: opslag bliver tips til redaktøren, aldrig artikler
#               (andre medier og borgergrupper på Facebook)
#   billeder    ja: billeder må vises med kreditering
#               nej: billeder må aldrig bruges (fx andre mediers fotos)
#   kalender    true: alle opslag gennemgås for arrangementer til kalenderen
#   kun_kalender true: bruges kun til kalenderen, ikke til nyheder
#   aktiv       false = kilden er kendt, men hentes ikke (fx mangler URL)
#   sprog       da
#   verificeret true når kilden er testet mod den rigtige hjemmeside
#   html        CSS-selektorer, der udpeger opslag (type html) eller felter på
#               artikelsiden (type sitemap). `billede` peger på et <img>.
#               `url_uden_query: true` fjerner alt efter ? i links (nogle
#               sider sætter dagens dato på, så samme opslag ellers ser nyt ud).
#               Med `hel_side: true` bliver hele siden ét opslag, så man
#               kan se, når indholdet ændrer sig.
#   sitemap     Kun for type sitemap: prefix (kun URL'er der starter sådan),
#               moenster (valgfrit regulært udtryk URL'en skal matche) og
#               max (højst så mange, nyeste først)
#   regler      Fritekst om særlige hensyn
#
# Kilderne er verificeret mod de rigtige hjemmesider den 27. oktober 2026.
# Facebook og Instagram hentes via rss.app, som laver sider og grupper om til
# RSS-feeds. Øvrige profiler står i config/steder.yaml.

kilder:
  # --- Officielle kilder ------------------------------------------------------

  - id: halsnaes-kommune-nyheder
    navn: Halsnæs Kommune, nyheder
    url: https://halsnaes.dk/sitemap.xml
    type: sitemap
    kategori: kommune
    by: Halsnæs
    tillid: 5
    frekvens: 6
    prioritet: 2
    billeder: ja
    sprog: da
    verificeret: true
    sitemap:
      prefix: https://halsnaes.dk/nyheder/
      moenster: '^https://halsnaes\.dk/nyheder/\d{4}/[^/]+/[^/]+$'
      max: 20
    html:
      titel: h1
    regler: >
      Officiel kilde for hele kommunen. Nyhedslisten laves med JavaScript,
      derfor bruges sitemappet. Kun nyheder med betydning for Hundested er
      relevante; Frederiksværk-stof er udlandsstof.

