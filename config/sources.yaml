# Kildeprofiler for Gulvmåtten 2.0
#
# Hver kilde har:
#   id          Kort unikt navn
#   navn        Visningsnavn
#   url         Adressen der hentes
#   type        rss, html, sitemap eller boligsiden
#   kategori    Hvilken slags kilde (kommune, havn, kultur, sport, forening, medie, bolig ...)
#   by          Hundested, Halsnæs (hele kommunen) eller Frederiksværk
#   tillid      1-5, hvor 5 er en officiel kilde man kan stole fuldt på
#   frekvens    Hvor ofte kilden bør hentes, i timer
#   prioritet   1-3. 3 = særligt fokus, opslag vurderes en ekstra gang op
#   billeder    ja: billeder må vises med kreditering
#               nej: billeder må aldrig bruges (fx andre mediers fotos)
#   aktiv       false = kilden er kendt, men hentes ikke (fx mangler URL)
#   sprog       da
#   verificeret true når kilden er testet mod den rigtige hjemmeside
#   html        CSS-selektorer, der udpeger opslag (type html) eller felter på
#               artikelsiden (type sitemap). `billede` peger på et <img>.
#               `url_uden_query: true` fjerner alt efter ? i links (nogle
#               sider sætter dagens dato på, så samme opslag ellers ser nyt ud).
#               Med `hel_side: true` bliver hele siden ét opslag, så man
#               kan se, når indholdet ændrer sig.
#   sitemap     Kun for type sitemap: prefix (kun URL'er der starter sådan),
#               moenster (valgfrit regulært udtryk URL'en skal matche) og
#               max (højst så mange, nyeste først)
#   regler      Fritekst om særlige hensyn
#
# Kilderne er verificeret mod de rigtige hjemmesider den 27. oktober 2026.
# Sociale medier (Facebook, Instagram) kan ikke hentes automatisk; de står
# i config/steder.yaml og overvåges manuelt indtil videre.

kilder:
  # --- Officielle kilder ------------------------------------------------------

  - id: halsnaes-kommune-nyheder
    navn: Halsnæs Kommune, nyheder
    url: https://halsnaes.dk/sitemap.xml
    type: sitemap
    kategori: kommune
    by: Halsnæs
    tillid: 5
    frekvens: 6
    prioritet: 2
    billeder: ja
    sprog: da
    verificeret: true
    sitemap:
      prefix: https://halsnaes.dk/nyheder/
      moenster: '^https://halsnaes\.dk/nyheder/\d{4}/[^/]+/[^/]+$'
      max: 20
    html:
      titel: h1
    regler: >
      Officiel kilde for hele kommunen. Nyhedslisten laves med JavaScript,
      derfor bruges sitemappet. Kun nyheder med betydning for Hundested er
      relevante; Frederiksværk-stof er udlandsstof.

  # --- Havnen og Lynæs ------------------------------------------------------------

  - id: hundested-havn
    navn: Hundested Havn
    url: https://hundestedhavn.dk/feed/
    type: rss
    kategori: havn
    by: Hundested
    tillid: 5
    frekvens: 72
    prioritet: 3
    billeder: ja
    sprog: da
    verificeret: true
    regler: >
      Havnens egne nyheder. Opdateres sjældent. Forretninger, spisesteder og
      foreninger på havnen står i config/steder.yaml.

  - id: lynaes-surfcenter
    navn: Lynæs Surfcenter og Madbaren
    url: https://surfcenter.dk/
    type: html
    kategori: kultur
    by: Hundested
    tillid: 4
    frekvens: 24
    prioritet: 3
    billeder: ja
    sprog: da
    verificeret: true
    html:
      opslag: 'a.card_inner[href*="/vare/"]'
      titel: h5
      resume: .card_content p
      billede: img
      url_uden_query: true
    regler: >
      Kommerciel aktør, men Lynæs' kulturelle omdrejningspunkt. Koncerter,
      events, loppemarked og sommerbio er stof; kurser og udlejning er ikke.
      Datoen står ofte i titlen (fx "Poul Krebs 7. august"). Tjek årstal.

  - id: lynaes-sejl-kajakklub
    navn: Lynæs Sejl- og Kajakklub
    url: https://www.lynaes.dk/feed/
    type: rss
    kategori: forening
    by: Hundested
    tillid: 4
    frekvens: 24
    billeder: ja
    sprog: da
    verificeret: true
    regler: Foreningsnyheder. Kapsejlads hører under sport.

  # --- Kultur -------------------------------------------------------------------

  - id: folkely-festival
    navn: Folkely Festival
    url: https://www.folkely.dk/blog-feed.xml
    type: rss
    kategori: kultur
    by: Hundested
    tillid: 4
    frekvens: 12
    prioritet: 3
    billeder: ja
    sprog: da
    verificeret: true
    regler: >
      Særligt fokus. Feedet er festivalens egen samling af presseomtale
      (Ekstra Bladet, TV 2 Kosmopol m.fl.), ikke kun egne nyheder. Henvis til
      det oprindelige medie, når en historie stammer derfra. Line-up og
      billetinfo står på forsiden folkely.dk.

  - id: folkely-forside
    navn: Folkely Festival, forside
    url: https://www.folkely.dk/
    type: html
    kategori: kultur
    by: Hundested
    tillid: 4
    frekvens: 24
    prioritet: 3
    billeder: ja
    sprog: da
    verificeret: true
    html:
      hel_side: true
      resume: main
    regler: >
      Hele forsiden registreres som ét opslag. Når teksten ændrer sig (nye
      navne på plakaten, billetbølger), markeres opslaget som ændret.

  # --- Lokale medier ---------------------------------------------------------------

  - id: faa-halsnaes
    navn: Frederiksborg Amts Avis, Halsnæs
    url: https://frederiksborgamtsavis.sn.dk/halsnaes
    type: html
    kategori: medie
    by: Halsnæs
    tillid: 3
    frekvens: 6
    billeder: nej
    sprog: da
    verificeret: true
    html:
      opslag: a.card
      titel: h2
      resume: .card__kicker
    regler: >
      Konkurrerende medie (Sjællandske Medier, også udgiver af Halsnæs Avis).
      Bruges kun som tip: vi skriver aldrig deres tekst om og bruger aldrig
      deres billeder. En historie herfra kræver en selvstændig kilde, fx
      kommunen eller arrangøren. Resuméet er avisens stednavn (fx "Hundested").
      Mange artikler er bag betalingsmur.

  # --- Sport -----------------------------------------------------------------------

  - id: hundested-ik-futsal
    navn: Hundested IK, futsal
    url: https://www.dbu.dk/
    type: html
    kategori: sport
    by: Hundested
    tillid: 4
    frekvens: 24
    prioritet: 2
    billeder: ja
    aktiv: false
    sprog: da
    verificeret: false
    html:
      opslag: article
    regler: >
      MANGLER URL. Klubbens egen side eller holdside er ikke fundet. Indtil
      da fanges futsal via Frederiksborg Amts Avis og kommunen.

  # --- Boliger --------------------------------------------------------------------

  - id: boliger-til-salg
    navn: Boliger til salg i 3390 Hundested
    url: https://api.boligsiden.dk/search/cases?zipCodes=3390&per_page=12&sortBy=timeOnMarket&sortAscending=true
    type: boligsiden
    kategori: bolig
    by: Hundested
    tillid: 4
    frekvens: 12
    billeder: ja
    sprog: da
    verificeret: true
    regler: >
      Boligsidens samlede liste over alle mægleres boliger i 3390. Bruges kun
      til boksen "Nye boliger til salg", ikke til artikler. Billeder vises med
      mæglerens navn og link til salgsopstillingen.
