# Steder i Hundested: spisesteder, kultur og foreninger.
#
# Bruges til:
#   - madsektionen ("Ugens spisested"), som tager spisestederne på skift
#   - manuel overvågning af sociale medier (Facebook/Instagram kan ikke
#     hentes automatisk uden at overtræde deres vilkår)
#   - at genkende stednavne i opslag
#
# Grundlisten stammer fra hundestedhavn.dk/kultur-oplevelser (27. oktober 2026).
# `python -m gulvmaatten spisesteder opdater` tjekker havnens side for nye
# spisesteder. Nye steder skrives ikke automatisk ind her; de vises, så en
# redaktør kan tilføje dem.
#
# Felter: id, navn, type (spisested, kultur, forening, overnatning, butik),
# adresse, web, facebook, instagram, note.

